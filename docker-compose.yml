# RoundsAhead — self-contained stack.
#
# Runs alongside the tv-tracker stack on the same host without collisions:
# distinct container/volume names, its own Postgres (not published to the host,
# so no clash with tv-tracker's 5432), its own cloudflared tunnel, and a host
# web port (8080) that does not overlap tv-tracker.
#
#   postgres    -> RoundsAhead's database (internal only)
#   api         -> Express + Prisma auth/sync service
#   web         -> nginx serving the landing page (/) + SPA (/app), proxying /api
#   cloudflared -> public HTTPS (optional profile)

services:
  postgres:
    image: postgres:16-alpine
    container_name: roundsahead_postgres
    restart: always
    environment:
      POSTGRES_USER: roundsahead
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: roundsahead
    volumes:
      - roundsahead_pgdata:/var/lib/postgresql/data
    # Internal only — reachable by the api container over the compose network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundsahead"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: roundsahead_api
    restart: always
    environment:
      PORT: 4100
      NODE_ENV: production
      DATABASE_URL: "postgresql://roundsahead:${POSTGRES_PASSWORD}@postgres:5432/roundsahead?schema=public"
      JWT_SECRET: "${JWT_SECRET}"
      # Set true once served exclusively over HTTPS (roundsahead.com).
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Public base URL, used to build OAuth redirect URIs and post-login redirects.
      APP_BASE_URL: "${APP_BASE_URL:-}"
      # Google OAuth
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # Sign in with Apple (the .p8 key is mounted from ./secrets, not env)
      APPLE_TEAM_ID: "${APPLE_TEAM_ID:-}"
      APPLE_SERVICES_ID: "${APPLE_SERVICES_ID:-}"
      APPLE_KEY_ID: "${APPLE_KEY_ID:-}"
      APPLE_PRIVATE_KEY_PATH: "/app/secrets/apple_key.p8"
      # Stripe (payments)
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_ID: "${STRIPE_PRICE_ID:-}"
      ENTITLEMENT_MONTHS: "${ENTITLEMENT_MONTHS:-12}"
      # College Scorecard (net price by income, admissions, earnings)
      SCORECARD_API_KEY: "${SCORECARD_API_KEY:-}"
      # Ops: structured-log level + error monitoring (both optional).
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
    volumes:
      # Drop the Sign in with Apple key at ./secrets/apple_key.p8 on the host.
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4100"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: roundsahead_web
    restart: always
    ports:
      # Host port 8080 -> container 80.
      - "8080:80"
    depends_on:
      - api

  # Public HTTPS via Cloudflare Tunnel. Enable with:  --profile cloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: roundsahead_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - web
    profiles:
      - cloudflare

volumes:
  roundsahead_pgdata:
